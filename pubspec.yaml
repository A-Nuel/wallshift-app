name: wallshift
description: Automatic wallpaper rotation on screen wake, with a timed fallback.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  reorderable_grid_view: ^2.2.8
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
