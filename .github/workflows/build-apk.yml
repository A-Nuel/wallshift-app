name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Scaffold Flutter project and overlay app code
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/wallshift_build"
          mkdir -p "$WORK"
          flutter create --org com.nuel --project-name wallshift -a kotlin --platforms=android "$WORK"

          rm -rf "$WORK/lib"
          cp -a lib "$WORK/lib"
          cp pubspec.yaml "$WORK/pubspec.yaml"

          KOTLIN_DIR="$WORK/android/app/src/main/kotlin/com/nuel/wallshift"
          mkdir -p "$KOTLIN_DIR"
          find "$WORK/android/app/src/main/kotlin" -name 'MainActivity.kt' -delete || true
          cp android_native/kotlin/com/nuel/wallshift/*.kt "$KOTLIN_DIR/"

          export WORK
          python3 <<'PY'
          import os, pathlib, re, sys, struct, zlib

          root = pathlib.Path(os.environ["WORK"])

          # Manifest merge
          manifest = root / "android/app/src/main/AndroidManifest.xml"
          additions = pathlib.Path("android_native/AndroidManifest_ADDITIONS.xml").read_text()
          perms = re.findall(r"<uses-permission[^/]*/>", additions)
          blocks = re.findall(
              r"<(?:service|receiver)\b[\s\S]*?</(?:service|receiver)>",
              additions,
          )
          text = manifest.read_text()
          if "<application" not in text:
              sys.exit("No <application> in manifest")
          text = text.replace("<application", "\n".join(perms) + "\n    <application", 1)
          text = text.replace("</application>", "\n".join(blocks) + "\n    </application>", 1)
          manifest.write_text(text)
          print("Manifest merged: +%d perms, +%d components" % (len(perms), len(blocks)))

          # WorkManager dependency
          groovy = root / "android/app/build.gradle"
          kts = root / "android/app/build.gradle.kts"
          app_build = groovy if groovy.exists() else kts
          src = app_build.read_text()
          if "work-runtime-ktx" not in src:
              if app_build.suffix == ".kts":
                  dep = '    implementation("androidx.work:work-runtime-ktx:2.9.1")\n'
              else:
                  dep = '    implementation "androidx.work:work-runtime-ktx:2.9.1"\n'
              if re.search(r"dependencies\s*\{", src):
                  src = re.sub(r"(dependencies\s*\{)", r"\1\n" + dep, src, count=1)
              else:
                  src += "\ndependencies {\n" + dep + "}\n"
              app_build.write_text(src)
              print("Added work-runtime-ktx")

          # Generate simple adaptive-style PNG launcher icons (ember accent)
          def write_png(path, size, rgba_fn):
              raw = bytearray()
              for y in range(size):
                  raw.append(0)  # filter
                  for x in range(size):
                      r, g, b, a = rgba_fn(x, y, size)
                      raw.extend([r, g, b, a])
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
              path.write_bytes(png)

          def icon_pixel(x, y, size):
              # dark bg + orange rounded square
              cx, cy = size / 2, size / 2
              dx, dy = abs(x - cx), abs(y - cy)
              # outer circle-ish
              if (dx * dx + dy * dy) > (size * 0.42) ** 2:
                  return (18, 16, 20, 255)
              # inner accent tile
              if dx < size * 0.22 and dy < size * 0.22:
                  return (255, 107, 74, 255)
              return (36, 32, 40, 255)

          res = root / "android/app/src/main/res"
          for folder, sz in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              write_png(d / "ic_launcher.png", sz, icon_pixel)
              write_png(d / "ic_launcher_round.png", sz, icon_pixel)
          print("Generated launcher icons")
          PY

          echo "BUILD_DIR=$WORK" >> "$GITHUB_ENV"

      - name: Flutter pub get
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallshift-apk
          path: ${{ env.BUILD_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
