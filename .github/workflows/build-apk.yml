name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Scaffold Flutter project and overlay app code
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/wallshift_build"
          mkdir -p "$WORK"
          flutter create --org com.nuel --project-name wallshift -a kotlin --platforms=android "$WORK"

          rm -rf "$WORK/lib"
          cp -a lib "$WORK/lib"
          cp pubspec.yaml "$WORK/pubspec.yaml"

          KOTLIN_DIR="$WORK/android/app/src/main/kotlin/com/nuel/wallshift"
          mkdir -p "$KOTLIN_DIR"
          find "$WORK/android/app/src/main/kotlin" -name 'MainActivity.kt' -delete || true
          cp android_native/kotlin/com/nuel/wallshift/*.kt "$KOTLIN_DIR/"

          export WORK
          python3 <<'PY'
          import os, pathlib, re, sys, struct, zlib, math

          root = pathlib.Path(os.environ["WORK"])

          manifest = root / "android/app/src/main/AndroidManifest.xml"
          additions = pathlib.Path("android_native/AndroidManifest_ADDITIONS.xml").read_text()
          perms = re.findall(r"<uses-permission[^/]*/>", additions)
          blocks = re.findall(
              r"<(?:service|receiver)\b[\s\S]*?</(?:service|receiver)>",
              additions,
          )
          text = manifest.read_text()
          if "<application" not in text:
              sys.exit("No <application> in manifest")
          text = text.replace("<application", "\n".join(perms) + "\n    <application", 1)
          text = text.replace("</application>", "\n".join(blocks) + "\n    </application>", 1)
          manifest.write_text(text)
          print("Manifest merged: +%d perms, +%d components" % (len(perms), len(blocks)))

          groovy = root / "android/app/build.gradle"
          kts = root / "android/app/build.gradle.kts"
          app_build = groovy if groovy.exists() else kts
          src = app_build.read_text()
          if "work-runtime-ktx" not in src:
              if app_build.suffix == ".kts":
                  dep = '    implementation("androidx.work:work-runtime-ktx:2.9.1")\n'
              else:
                  dep = '    implementation "androidx.work:work-runtime-ktx:2.9.1"\n'
              if re.search(r"dependencies\s*\{", src):
                  src = re.sub(r"(dependencies\s*\{)", r"\1\n" + dep, src, count=1)
              else:
                  src += "\ndependencies {\n" + dep + "}\n"
              app_build.write_text(src)
              print("Added work-runtime-ktx")

          def write_png(path, size, rgba_fn):
              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      r, g, b, a = rgba_fn(x, y, size)
                      raw.extend([r, g, b, a])
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
              path.write_bytes(png)

          def dist(x, y, cx, cy):
              return math.hypot(x - cx, y - cy)

          def in_rounded_rect(x, y, left, top, right, bottom, radius):
              if left + radius <= x <= right - radius and top <= y <= bottom:
                  return True
              if left <= x <= right and top + radius <= y <= bottom - radius:
                  return True
              corners = [
                  (left + radius, top + radius),
                  (right - radius, top + radius),
                  (left + radius, bottom - radius),
                  (right - radius, bottom - radius),
              ]
              for cx, cy in corners:
                  if dist(x, y, cx, cy) <= radius:
                      return True
              return False

          def icon_pixel(x, y, size):
              """WallShift logo: dark circle + stacked shifting panels (wallpaper metaphor)."""
              s = float(size)
              cx, cy = s / 2, s / 2
              r_outer = s * 0.48
              # transparent outside circle for adaptive feel on some launchers
              if dist(x, y, cx, cy) > r_outer:
                  return (0, 0, 0, 0)

              # base fill
              bg = (22, 18, 24, 255)
              # soft radial dark
              t = dist(x, y, cx, cy) / r_outer
              base_r = int(22 + 8 * t)
              base_g = int(18 + 6 * t)
              base_b = int(24 + 10 * t)
              color = (base_r, base_g, base_b, 255)

              # three stacked "wallpaper" cards, slightly offset = shift
              # card 1 (back) - muted
              c1_l, c1_t = s * 0.28, s * 0.22
              c1_r, c1_b = s * 0.62, s * 0.70
              # card 2 (mid) - orange
              c2_l, c2_t = s * 0.34, s * 0.28
              c2_r, c2_b = s * 0.68, s * 0.76
              # card 3 (front) - bright accent
              c3_l, c3_t = s * 0.40, s * 0.34
              c3_r, c3_b = s * 0.74, s * 0.82
              rad = s * 0.06

              if in_rounded_rect(x, y, c1_l, c1_t, c1_r, c1_b, rad):
                  color = (70, 55, 62, 255)
              if in_rounded_rect(x, y, c2_l, c2_t, c2_r, c2_b, rad):
                  color = (230, 95, 70, 255)
              if in_rounded_rect(x, y, c3_l, c3_t, c3_r, c3_b, rad):
                  color = (255, 130, 95, 255)
                  # subtle highlight stripe on front card
                  if c3_t + s * 0.08 < y < c3_t + s * 0.14 and c3_l + s * 0.06 < x < c3_r - s * 0.06:
                      color = (255, 180, 150, 255)

              return color

          res = root / "android/app/src/main/res"
          for folder, sz in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              write_png(d / "ic_launcher.png", sz, icon_pixel)
              write_png(d / "ic_launcher_round.png", sz, icon_pixel)
          print("Generated WallShift logo icons")
          PY

          echo "BUILD_DIR=$WORK" >> "$GITHUB_ENV"

      - name: Flutter pub get
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallshift-apk
          path: ${{ env.BUILD_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
