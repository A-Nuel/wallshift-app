name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Scaffold Flutter project and overlay app code
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/wallshift_build"
          mkdir -p "$WORK"
          flutter create --org com.nuel --project-name wallshift -a kotlin --platforms=android "$WORK"

          rm -rf "$WORK/lib"
          cp -a lib "$WORK/lib"
          cp pubspec.yaml "$WORK/pubspec.yaml"

          KOTLIN_DIR="$WORK/android/app/src/main/kotlin/com/nuel/wallshift"
          mkdir -p "$KOTLIN_DIR"
          find "$WORK/android/app/src/main/kotlin" -name 'MainActivity.kt' -delete || true
          cp android_native/kotlin/com/nuel/wallshift/*.kt "$KOTLIN_DIR/"

          export WORK
          python3 <<'PY'
          import os, pathlib, re, sys

          root = pathlib.Path(os.environ["WORK"])

          # --- Manifest merge ---
          manifest = root / "android/app/src/main/AndroidManifest.xml"
          additions = pathlib.Path("android_native/AndroidManifest_ADDITIONS.xml").read_text()
          perms = re.findall(r"<uses-permission[^/]*/>", additions)
          blocks = re.findall(
              r"<(?:service|receiver)\b[\s\S]*?</(?:service|receiver)>",
              additions,
          )
          text = manifest.read_text()
          if "<application" not in text:
              sys.exit("No <application> in manifest")
          text = text.replace("<application", "\n".join(perms) + "\n    <application", 1)
          text = text.replace("</application>", "\n".join(blocks) + "\n    </application>", 1)
          manifest.write_text(text)
          print("Manifest merged: +%d perms, +%d components" % (len(perms), len(blocks)))

          # --- build.gradle / build.gradle.kts ---
          groovy = root / "android/app/build.gradle"
          kts = root / "android/app/build.gradle.kts"
          app_build = groovy if groovy.exists() else kts
          if not app_build.exists():
              sys.exit("No app build.gradle found")
          src = app_build.read_text()
          print("Patching", app_build)

          # Force minSdk 23 without touching flutter.* property names
          if app_build.suffix == ".kts":
              src2, n = re.subn(
                  r"minSdk\s*=\s*[^\n]+",
                  "minSdk = 23",
                  src,
                  count=1,
              )
              if n == 0:
                  src2 = re.sub(
                      r"(defaultConfig\s*\{)",
                      r"\1\n        minSdk = 23",
                      src,
                      count=1,
                  )
              dep_line = '    implementation("androidx.work:work-runtime-ktx:2.9.1")\n'
          else:
              src2, n = re.subn(
                  r"minSdkVersion\s+[^\n]+",
                  "minSdkVersion 23",
                  src,
                  count=1,
              )
              if n == 0:
                  src2 = re.sub(
                      r"(defaultConfig\s*\{)",
                      r"\1\n        minSdkVersion 23",
                      src,
                      count=1,
                  )
              dep_line = '    implementation "androidx.work:work-runtime-ktx:2.9.1"\n'

          if "work-runtime-ktx" not in src2:
              if re.search(r"dependencies\s*\{", src2):
                  src2 = re.sub(
                      r"(dependencies\s*\{)",
                      r"\1\n" + dep_line,
                      src2,
                      count=1,
                  )
              else:
                  src2 += "\ndependencies {\n" + dep_line + "}\n"

          app_build.write_text(src2)
          print("--- build file after patch ---")
          print(src2)
          PY

          echo "BUILD_DIR=$WORK" >> "$GITHUB_ENV"
          echo "Scaffolded at $WORK"

      - name: Flutter pub get
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallshift-apk
          path: ${{ env.BUILD_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
